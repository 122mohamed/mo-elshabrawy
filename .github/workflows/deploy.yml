name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, sqlite3, mbstring, tokenizer, xml, ctype, curl, fileinfo, openssl

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Build Vite assets
        run: npm run build

      - name: Setup Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          touch database/database.sqlite
          php artisan migrate --force
          php artisan config:cache

      - name: Start Laravel server & generate static HTML
        run: |
          php artisan serve --port=8000 &
          sleep 5
          mkdir -p dist/projects/ideal-pos
          mkdir -p dist/projects/dawami-hr
          mkdir -p dist/projects/housemart
          curl -s http://127.0.0.1:8000 -o dist/index.html
          curl -s http://127.0.0.1:8000/projects/ideal-pos -o dist/projects/ideal-pos/index.html
          cp dist/projects/ideal-pos/index.html dist/projects/ideal-pos.html
          curl -s http://127.0.0.1:8000/projects/dawami-hr -o dist/projects/dawami-hr/index.html
          cp dist/projects/dawami-hr/index.html dist/projects/dawami-hr.html
          curl -s http://127.0.0.1:8000/projects/housemart -o dist/projects/housemart/index.html
          cp dist/projects/housemart/index.html dist/projects/housemart.html
          touch dist/.nojekyll

      - name: Copy public assets
        run: |
          cp -r public/build dist/build
          cp -r public/cv dist/cv
          cp -r public/images dist/images
          cp public/favicon.ico dist/favicon.ico || true

      - name: Fix asset paths for GitHub Pages
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          BASE="/${REPO_NAME}"
          find dist -type f -name "*.html" -exec sed -i "s|http://127.0.0.1:8000/|${BASE}/|g" {} +
          find dist -type f -name "*.html" -exec sed -i "s|http://127.0.0.1:8000#|${BASE}/#|g" {} +
          find dist -type f -name "*.html" -exec sed -i "s|http://127.0.0.1:8000\"|${BASE}/\"|g" {} +
          find dist -type f -name "*.html" -exec sed -i "s|\"/build/|\"${BASE}/build/|g" {} +
          find dist -type f -name "*.html" -exec sed -i "s|href=\"/build/|href=\"${BASE}/build/|g" {} +
          find dist -type f -name "*.html" -exec sed -i "s|\"/cv/|\"${BASE}/cv/|g" {} +
          find dist -type f -name "*.html" -exec sed -i "s|\"/images/|\"${BASE}/images/|g" {} +
          find dist -type f -name "*.html" -exec sed -i "s|src=\"/images/|src=\"${BASE}/images/|g" {} +

      - name: Create fallback 404 handler for SPA routing
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          cat << 'EOF' > dist/404.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <title>Redirecting...</title>
              <script>
                  (function() {
                      var path = window.location.pathname;
                      var repo = '/' + window.location.pathname.split('/')[1];
                      if (path.indexOf('ideal-pos') !== -1) {
                          window.location.replace(repo + '/projects/ideal-pos/');
                          return;
                      }
                      if (path.indexOf('dawami-hr') !== -1) {
                          window.location.replace(repo + '/projects/dawami-hr/');
                          return;
                      }
                      if (path.indexOf('housemart') !== -1) {
                          window.location.replace(repo + '/projects/housemart/');
                          return;
                      }
                      window.location.replace(repo + '/');
                  })();
              </script>
          </head>
          <body>
              <p>Redirecting...</p>
          </body>
          </html>
          EOF

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
