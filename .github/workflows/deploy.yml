name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, sqlite3, mbstring, tokenizer, xml, ctype, curl, fileinfo, openssl

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Install Node dependencies
        run: npm install

      - name: Build Vite assets
        run: npm run build

      - name: Setup Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          touch database/database.sqlite
          php artisan migrate --force
          php artisan config:cache

      - name: Start Laravel server & generate static HTML
        run: |
          php artisan serve --port=8000 &
          sleep 4
          mkdir -p dist
          curl -s http://127.0.0.1:8000 -o dist/index.html

      - name: Copy public assets
        run: |
          cp -r public/build dist/build
          cp -r public/cv dist/cv
          cp -r public/images dist/images
          cp public/favicon.ico dist/favicon.ico || true

      - name: Fix asset paths for GitHub Pages
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          BASE="/${REPO_NAME}"
          sed -i "s|http://127.0.0.1:8000/build/|${BASE}/build/|g" dist/index.html
          sed -i "s|\"/build/|\"${BASE}/build/|g" dist/index.html
          sed -i "s|href=\"/build/|href=\"${BASE}/build/|g" dist/index.html
          sed -i "s|\"/cv/|\"${BASE}/cv/|g" dist/index.html
          sed -i "s|\"/images/|\"${BASE}/images/|g" dist/index.html
          sed -i "s|src=\"/images/|src=\"${BASE}/images/|g" dist/index.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
